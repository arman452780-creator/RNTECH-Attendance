<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="attendance.css">
    <script src="theme-logic.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%;">
                <div class="header-left">
                    <button id="historyBtn"
                        style="background: var(--primary-light); border: none; color: var(--primary); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        History
                    </button>
                </div>
                <div class="app-brand" style="justify-content: center; font-size: 24px; gap: 0;">
                    <span
                        style="font-weight: 800; background: linear-gradient(135deg, #2563eb, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px;">RN -</span>
                    <span style="font-weight: 300; color: #64748b; letter-spacing: 0;">TECH</span>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; align-items: center;">
                    <div class="theme-toggle-header" id="themeToggle" style="cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); border-radius: 8px; color: var(--text-dark);">
                        <i class="fa-solid fa-moon"></i>
                    </div>
                    <button id="logoutBtn"
                        style="background: var(--border-color); border: none; color: var(--text-dark); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </div>
            </div>
            <h1 class="class-title">Attendance Record</h1>
            <p class="datetime" id="currentDateTime">Loading date and time...</p>
        </header>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="filter-row">
                <div class="filter-group">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <select id="courseFilter" class="course-select">
                        <option value="all">All Classes</option>
                    </select>
                </div>
            </div>

            <div class="toggle-container">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="toggle-label">Edit Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="editModeToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <button id="resetTodayBtn" class="reset-btn">
                    <i class="fa-solid fa-trash-can"></i> Reset Today's Attendance
                </button>
            </div>

            <div class="tabs">
                <div class="tab active" data-filter="all">All Students</div>
                <div class="tab" data-filter="unmarked">Unmarked</div>
            </div>
        </div>

        <!-- Student List (Populated dynamically from Firestore) -->
        <main class="student-list" id="studentList">
            <div id="loadingState" style="text-align: center; padding: 40px; color: var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading students...
            </div>

            <!-- Safe space for bottom button -->
            <div class="bottom-spacer"></div>
        </main>

        <!-- Bottom Fixed Button -->
        <div class="bottom-action">
            <button class="submit-btn" id="submitBtn">Submit Attendance</button>
        </div>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="resetModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fa-solid fa-triangle-exclamation" style="color: var(--absent-color); font-size: 24px; margin-bottom: 12px;"></i>
                <h2>Confirm Reset</h2>
                <p>Please enter your teacher password to delete today's attendance records.</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="resetPasswordInput" placeholder="Enter password">
                </div>
                <div id="modalError" class="modal-error" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button id="cancelResetBtn" class="modal-btn secondary">Cancel</button>
                <button id="confirmResetBtn" class="modal-btn primary">Confirm Reset</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="attendance.js"></script>
</body>

</html>
