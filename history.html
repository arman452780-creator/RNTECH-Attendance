<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="history.css">
    <script src="theme-logic.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <button class="back-btn" onclick="window.history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="header-title" style="flex: 1;">History</h1>
            <div class="theme-toggle-header" id="themeToggle" style="cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); border-radius: 8px; color: var(--text-dark);">
                <i class="fa-solid fa-moon"></i>
            </div>
        </header>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="present">Present</option>
                    <option value="late">Late</option>
                    <option value="absent">Absent</option>
                </select>
                <select id="classFilter">
                    <option value="all">All Classes</option>
                </select>
            </div>
            <div class="filter-group">
                <input type="date" id="dateFilter">
                <button id="resetFilters" title="Reset Filters">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- History List -->
        <main class="history-list" id="historyList">
            <!-- Records will be dynamically inserted here -->
            <div class="empty-state" id="emptyState" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center;">
                <div style="background: var(--bg-main); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                    <i class="fa-solid fa-clipboard-list" style="font-size: 32px; color: var(--text-muted);"></i>
                </div>
                <h3 style="color: var(--text-dark); font-size: 18px; margin-bottom: 8px;">No records found</h3>
                <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; max-width: 240px;">No attendance matches your current filters. Try adjusting them or wait for the teacher to mark new sessions.</p>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="history.js"></script>
</body>
</html>
