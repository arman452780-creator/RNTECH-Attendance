<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blur"></div>
    <div class="login-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 0;">
                <span style="font-weight: 800; background: linear-gradient(135deg, #2563eb, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px;">RN</span>
                <span style="font-weight: 300; color: #64748b; letter-spacing: 0;">TECH</span>
            </h1>
            <p>Sign in to your account</p>
        </div>

        <!-- Role Selection removed as signup is now student-only and login role is data-driven -->

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <!-- Name Input (Hidden for Login, shown for Signup) -->
            <div class="form-group" id="nameField" style="display: none;">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" placeholder="Enter your full name" id="nameInput">
                </div>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" placeholder="name@institute.edu" required id="emailInput">
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <div class="label-row">
                    <label>Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" placeholder="••••••••" required id="passwordInput" style="padding-right: 40px;">
                    <i class="fa-solid fa-eye eye-icon" id="togglePassword"></i>
                </div>
            </div>

            <!-- Course Input (Hidden for Login, shown for Signup) -->
            <div class="form-group" id="courseField" style="display: none;">
                <label>Select Course</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-book-open icon"></i>
                    <select id="courseInput" style="width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 15px; color: var(--text-dark); background-color: var(--card-bg); outline: none; cursor: pointer; -webkit-appearance: none; appearance: none;">
                        <option value="" disabled selected>Select Course</option>
                        <option value="ADCA">ADCA</option>
                        <option value="DCA">DCA</option>
                    </select>
                    <i class="fa-solid fa-chevron-down" style="position: absolute; right: 14px; font-size: 12px; color: #94a3b8; pointer-events: none;"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span id="submitBtnText">Login</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Auth Toggle -->
        <div class="form-footer" style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            <span id="toggleMsg">Join RN-TECH today</span>
            <a href="#" id="toggleAuthMode" style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px;">Sign Up</a>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-storage-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="script.js"></script>
</body>
</html>
