<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RN-TECH Fee Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="teacher_dashboard.css">
    <link rel="stylesheet" href="teacher_students.css">
    <link rel="stylesheet" href="attendance.css"> <!-- Reusing bottom-nav styles -->
    <link rel="stylesheet" href="global-theme.css">
    <link rel="stylesheet" href="fee_management.css">
    <link rel="stylesheet" href="ui-popups.css">
    <script src="theme-system.js"></script>
    <script src="no-zoom.js"></script>
    <link rel="stylesheet" href="smooth-scroll.css">
</head>
<body>
    <div class="app-container">
        <!-- PROPER STICKY TOP CONTAINER -->
        <div class="sticky-top-container" style="position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); background: rgba(10, 15, 30, 0.92); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
            <header class="dashboard-header" style="padding-bottom: 15px; background: transparent; backdrop-filter: none;">
                <div class="header-main" style="margin-bottom: 0;">
                    <div class="user-greeting" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <a href="teacher_dashboard.html" class="back-btn" style="color: var(--text-dark); font-size: 20px; text-decoration: none; padding: 5px; opacity: 0.8;">
                                <i class="fa-solid fa-arrow-left"></i>
                            </a>
                            <div>
                                <p class="greeting" id="feeSummaryText">Loading stats...</p>
                                <h1 class="user-name">Fee Center</h1>
                            </div>
                        </div>
                        <a href="fee_analytics.html" style="background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: var(--primary); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-chart-pie"></i> Analytics
                        </a>
                    </div>
                </div>
            </header>

            <!-- Filter & Sort Bar -->
            <div class="fee-filter-bar" style="position: static; padding: 0 20px; margin-bottom: 0;">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="feeSearchInput" placeholder="Search student...">
                </div>
                <div class="filter-chips">
                    <button class="filter-chip active" data-filter="all">All</button>
                    <button class="filter-chip" data-filter="overdue">Overdue <span id="chipOverdueCount" class="chip-count">0</span></button>
                    <button class="filter-chip" data-filter="due-soon">Due Soon <span id="chipDueSoonCount" class="chip-count">0</span></button>
                    <button class="filter-chip" data-filter="upcoming">Upcoming</button>
                </div>
            </div>
        </div>

        <!-- Scrollable Dashboard Content -->
        <main class="dashboard-content" id="dashboardContent" style="padding-top: 15px;">

            <!-- Fee Student List -->
            <div class="fee-student-list" id="feeStudentList">
                <div class="activity-loader">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
            </div>

            <div class="footer-spacer"></div>
        </main>

        <!-- Modern Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <div class="nav-content">
                <a href="teacher_dashboard.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-house-chimney"></i>
                    </div>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a href="attendance.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-clipboard-user"></i>
                    </div>
                    <span class="nav-label">Attendance</span>
                </a>

                <a href="teacher_students.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-user-group"></i>
                    </div>
                    <span class="nav-label">Students</span>
                </a>

                <a href="reports.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="nav-label">Reports</span>
                </a>

                <a href="teacher_profile.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <span class="nav-label">Profile</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <!-- Unlock Fee Modal -->
    <div class="modal-overlay" id="unlockFeeModal">
        <div class="modal-content glass-panel" style="max-width: 400px; text-align: center;">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 171, 0, 0.1); color: var(--warning); display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px;">
                <i class="fa-solid fa-unlock-keyhole"></i>
            </div>
            <h3 style="margin-bottom: 10px;">Unlock Fee Cycle</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Enter your teacher password to manually unlock this student's fee cycle.</p>
            <div class="input-group" style="text-align: left; margin-bottom: 20px;">
                <input type="password" id="unlockPasswordInput" class="rn-input" placeholder="Enter password" style="width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="cancelUnlockBtn" class="btn-secondary" style="flex: 1; padding: 12px; border-radius: 12px;">Cancel</button>
                <button id="confirmUnlockBtn" class="btn-primary" style="flex: 1; padding: 12px; border-radius: 12px; background: var(--warning); border: none; color: #000; font-weight: 600;">Unlock</button>
            </div>
        </div>
    </div>
    <!-- Custom Scripts -->
    <script src="js/core/local-cache.js"></script>
    <script src="js/core/render-engine.js"></script>
    <script src="js/core/firebase-sync.js"></script>
    <script src="js/components/templates.js"></script>
    <script src="js/core/app-init.js"></script>
    <script src="ui-popups.js"></script>
    <script src="fee_management.js"></script>
</body>
</html>
