<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="global-theme.css">
    <script src="theme-system.js"></script>
    <script src="no-zoom.js"></script>
    <link rel="stylesheet" href="smooth-scroll.css">
</head>

<body>
    <div class="app-container">
        <!-- Fixed Top Section -->
        <div class="fixed-header-section">
            <!-- Header Section -->
            <header class="app-header">
                <button class="back-btn" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 class="header-title" style="flex: 1;">History</h1>
            </header>

            <!-- Filter Bar -->
            <div class="filter-bar">

                <div class="filter-group">
                    <input type="text" id="dateFilter" class="date-input-small" placeholder="Select Date"
                        onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
                    <input type="text" id="nameSearch" placeholder="Search student...">
                    <button id="resetFilters" title="Refresh/Reset">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <!-- Attendance History Summary (Inside Filter Section for better alignment) -->
                <div class="attendance-summary" id="historySummary">
                    <div class="stat-pill present" id="pillPresent">
                        <span class="label">PRESENT</span>
                        <span class="count" id="countPresent">0</span>
                    </div>
                    <div class="stat-pill late" id="pillLate">
                        <span class="label">LATE</span>
                        <span class="count" id="countLate">0</span>
                    </div>
                    <div class="stat-pill absent" id="pillAbsent">
                        <span class="label">ABSENT</span>
                        <span class="count" id="countAbsent">0</span>
                    </div>
                </div>
            </div>
        </div>


        <!-- History List -->
        <main class="history-list" id="historyList">
            <!-- Records will be dynamically inserted here -->
            <div class="empty-state" id="emptyState"
                style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center;">
                <div
                    style="background: var(--bg-main); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                    <i class="fa-solid fa-clipboard-list" style="font-size: 32px; color: var(--text-muted);"></i>
                </div>
                <h3 style="color: var(--text-dark); font-size: 18px; margin-bottom: 8px;">No records found</h3>
                <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; max-width: 280px;">No records
                    match your selected criteria. Please adjust the filters or check back later for newly submitted
                    attendance logs.</p>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <!-- Core Local-First Engine Scripts -->
    <script src="js/core/local-cache.js"></script>
    <script src="js/core/render-engine.js"></script>
    <script src="js/core/firebase-sync.js"></script>
    <script src="js/components/templates.js"></script>
    <script src="js/core/app-init.js"></script>
    <script src="capacitor.js"></script>
    <script src="notifications.js"></script>
    <script src="history.js"></script>
</body>

</html>
