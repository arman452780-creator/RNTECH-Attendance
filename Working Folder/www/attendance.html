<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="attendance.css">
    <link rel="stylesheet" href="global-theme.css">
    <script src="theme-system.js"></script>
    <script src="no-zoom.js"></script>
    <script src="crash-logger.js"></script>
    <link rel="stylesheet" href="smooth-scroll.css">
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-top">
                <div class="header-left">
                    <!-- History button removed - relocated to Reports tab -->
                </div>
            </div>
            <h1 class="class-title">Attendance Record</h1>
            <p class="datetime" id="currentDateTime">Loading date and time...</p>

            <!-- Attendance Summary Feature -->
            <div class="attendance-summary" id="attendanceSummary">
                <div class="stat-pill present">
                    <span class="label">PRESENT</span>
                    <span class="count" id="countPresent">0</span>
                </div>
                <div class="stat-pill late">
                    <span class="label">LATE</span>
                    <span class="count" id="countLate">0</span>
                </div>
                <div class="stat-pill absent">
                    <span class="label">ABSENT</span>
                    <span class="count" id="countAbsent">0</span>
                </div>
            </div>
        </header>

        <!-- Global Announcement Removed from Attendance Records -->
        <div class="student-list-wrapper">
        <!-- Controls Section -->
        <div class="controls-section">
            <div class="filter-row">
                <div class="filter-group" style="flex: 1;">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <select id="courseFilter" class="course-select">
                        <option value="all">All Classes</option>
                    </select>
                </div>
                <div class="filter-group search-group" style="flex: 1;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="studentSearch" placeholder="Search student..." class="search-input">
                </div>
            </div>

            <div class="action-row">
                <button id="resetTodayBtn" class="reset-btn teacher-only" style="display: none;">
                    <i class="fa-solid fa-trash-can"></i> 
                    <span>Reset</span>
                </button>
                <button class="submit-btn" id="submitBtn">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Submit</span>
                </button>
            </div>

            <div class="tabs">
                <div class="tab active" data-filter="all">All Students</div>
                <div class="tab" data-filter="unmarked">Unmarked</div>
            </div>
        </div>

        <!-- Student List (Populated dynamically from Firestore) -->
            <main class="student-list" id="studentList">
                <div id="loadingState" class="loading-state">
                    <i class="fa-solid fa-spinner fa-spin"></i> Loading students...
                </div>

                <!-- Safe space for bottom button -->
                <div class="bottom-spacer"></div>
            </main>
        </div>

        <!-- Modern Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <div class="nav-content" id="teacherNav" style="display: none;">
                <a href="teacher_dashboard.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-house-chimney"></i>
                    </div>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a href="#" class="nav-item active">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-clipboard-user"></i>
                    </div>
                    <span class="nav-label">Attendance</span>
                </a>

                <a href="teacher_students.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-user-group"></i>
                    </div>
                    <span class="nav-label">Students</span>
                </a>

                <a href="reports.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="nav-label">Reports</span>
                </a>

                <a href="teacher_profile.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <span class="nav-label">Profile</span>
                </a>
            </div>
            
            <div class="nav-content" id="assistantNav" style="display: none;">
                <a href="assistant_dashboard.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-house-chimney"></i>
                    </div>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a href="#" class="nav-item active">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-clipboard-user"></i>
                    </div>
                    <span class="nav-label">Attendance</span>
                </a>

                <a href="assistant_profile.html" class="nav-item">
                    <div class="nav-icon-wrapper">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <span class="nav-label">Profile</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="resetModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fa-solid fa-triangle-exclamation modal-icon"></i>
                <h2>Confirm Reset</h2>
                <p>Please enter your teacher password to delete today's attendance records.</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="resetPasswordInput" placeholder="Enter password">
                    <i class="fa-solid fa-eye-slash eye-icon" id="toggleResetPassword"></i>
                </div>
                <div id="modalError" class="modal-error" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button id="cancelResetBtn" class="modal-btn secondary">Cancel</button>
                <button id="confirmResetBtn" class="modal-btn primary">Confirm Reset</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <!-- Core Local-First Engine Scripts -->
    <script src="js/core/local-cache.js"></script>
    <script src="js/core/render-engine.js"></script>
    <script src="js/core/firebase-sync.js"></script>
    <script src="js/components/templates.js"></script>
    <script src="js/core/app-init.js"></script>
    <script src="js/core/global-holiday.js"></script>
    <script src="capacitor.js"></script>
    <script src="notifications.js"></script>
    <script src="attendance.js"></script>
</body>

</html>
