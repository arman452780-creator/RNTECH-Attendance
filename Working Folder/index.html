<!DOCTYPE html>
<html lang="en" data-theme="dark-blue">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global-theme.css">
    <link rel="stylesheet" href="style.css">
    <script src="crash-logger.js"></script>
    <script src="no-zoom.js"></script>
    <link rel="stylesheet" href="smooth-scroll.css">

    <!-- PAGE-SCOPED ORIGINAL RN-TECH LOGIN STYLES -->
    <style id="original-login-theme">
        /* Step 3: Deep Dark Blue Background & Glow Particles */
        body {
            background: #040814 !important;
            /* Deep dark blue */
            background-image: radial-gradient(circle at 50% 0%, #0a142e 0%, #040814 70%) !important;
        }

        .background-blur::before,
        .background-blur::after {
            background: radial-gradient(circle, #0055ff, #002288) !important;
            opacity: 0.3 !important;
            filter: blur(80px) !important;
        }

        /* Step 5: Card Glassmorphism */
        .login-container {
            background: rgba(10, 15, 30, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(0, 85, 255, 0.2) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 85, 255, 0.1) !important;
        }

        /* Step 1 & 3: Branding Glow */
        .logo-box {
            background: linear-gradient(135deg, #0055ff, #0088ff) !important;
            box-shadow: 0 0 20px rgba(0, 85, 255, 0.5) !important;
        }

        .logo-halo {
            background: radial-gradient(circle, rgba(0, 85, 255, 0.4) 0%, transparent 70%) !important;
        }

        .header h1 {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(0, 85, 255, 0.4) !important;
        }

        /* Fix TECH text visibility */
        .login-logo .brand-tech {
            color: #ffffff !important; /* Force high contrast white */
            opacity: 1 !important; /* Remove faded opacity */
            font-weight: 400 !important;
            text-shadow: 0 2px 10px rgba(0, 85, 255, 0.6) !important; /* Glow behind text */
            z-index: 5 !important;
            position: relative;
        }

        /* Prevent glow layers from washing out text */
        .login-logo .brand-tech::after {
            z-index: -1 !important; /* Keep behind text */
            opacity: 0.4 !important; /* Reduce excessive blur overlapping */
        }

        /* Step 6: Text Contrast */
        .header p.logo-subtitle,
        .form-footer,
        .form-footer span,
        .dev-credit .sig-prefix {
            color: #94a3b8 !important;
        }

        .form-group label {
            color: #e2e8f0 !important;
            font-weight: 600 !important;
        }

        .forgot-link {
            color: #3b82f6 !important;
            font-weight: 600 !important;
        }

        /* Step 2: Restore Input Fields */
        .input-wrapper input,
        .theme-select {
            background-color: rgba(6, 11, 25, 0.7) !important;
            /* dark glass background */
            border: 1px solid rgba(0, 85, 255, 0.3) !important;
            /* subtle blue border */
            color: #ffffff !important;
            opacity: 1 !important;
            /* remove faded opacity */
        }

        /* Course Select Dropdown Fixes */
        .theme-select option {
            background-color: #0f172a !important;
            /* Safe solid dark fallback for WebViews */
            color: #ffffff !important;
            /* High contrast text */
            font-weight: 600 !important;
            padding: 14px !important;
        }

        .theme-select option:checked,
        .theme-select option:hover,
        .theme-select option:focus {
            background-color: #2563eb !important;
            /* Highlight color */
            color: #ffffff !important;
        }

        .input-wrapper input:focus,
        .theme-select:focus {
            border-color: #0055ff !important;
            background-color: rgba(6, 11, 25, 0.9) !important;
            box-shadow: 0 0 0 4px rgba(0, 85, 255, 0.15), 0 0 15px rgba(0, 85, 255, 0.3) !important;
            /* blue focus glow */
        }

        .input-wrapper input::placeholder {
            color: #64748b !important;
            opacity: 1 !important;
        }

        .input-wrapper .icon,
        .eye-icon {
            color: #3b82f6 !important;
        }

        /* Step 4: Login Button */
        .login-btn {
            background: linear-gradient(135deg, #0055ff, #0044cc) !important;
            box-shadow: 0 8px 20px rgba(0, 85, 255, 0.4) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) !important;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0066ff, #0055ff) !important;
            box-shadow: 0 10px 25px rgba(0, 85, 255, 0.6) !important;
        }

        .form-footer a,
        #toggleAuthMode {
            color: #3b82f6 !important;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.4) !important;
            font-weight: 700 !important;
        }
    </style>
</head>

<body>
    <div class="background-blur"></div>

    <!-- Initial Loading Screen -->
    <div id="initialLoader"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--loader-bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 20px;">
            <span
                style="font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #2563eb, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px;">RN
                -</span>
            <span style="font-size: 42px; font-weight: 300; color: #64748b; letter-spacing: 0;">TECH</span>
        </div>
        <div style="color: #64748b; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-spinner fa-spin" style="color: #2563eb;"></i>
            Verifying Session...
        </div>
    </div>

    <div class="login-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-box">
                RN
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo-wrapper">
                <div class="logo-halo"></div>
                <h1 class="app-brand login-logo">
                    <span class="brand-rn">RN-</span>
                    <span class="brand-tech">TECH</span>
                </h1>
            </div>
            <p class="logo-subtitle">Sign in to your account</p>
        </div>

        <!-- Role Selection removed as signup is now student-only and login role is data-driven -->

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <!-- Name Input (Hidden for Login, shown for Signup) -->
            <div class="form-group" id="nameField" style="display: none;">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" placeholder="Enter your full name" id="nameInput">
                </div>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" placeholder="Registered Email" required id="emailInput">
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <div class="label-row">
                    <label>Password</label>
                    <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" placeholder="Password" required id="passwordInput"
                        style="padding-right: 40px;">
                    <i class="fa-solid fa-eye eye-icon" id="togglePassword"></i>
                </div>
            </div>

            <!-- Course Input (Hidden for Login, shown for Signup) -->
            <div class="form-group" id="courseField" style="display: none;">
                <label>SELECT COURSE</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-book-open icon"></i>
                    <select id="courseInput" class="theme-select">
                        <option value="" disabled selected>SELECT COURSE</option>
                        <option value="ADCA">ADCA</option>
                        <option value="DCA">DCA</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-arrow"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span id="submitBtnText">Login</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Auth Toggle -->
        <div class="form-footer">
            <span id="toggleMsg">Join RN-TECH today</span>
            <a href="#" id="toggleAuthMode"
                style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px;">Sign Up</a>
        </div>

        <!-- Developer Credit -->
        <div class="dev-credit">
            <div class="brand-signature" style="text-align: center;color: #2563eb; font-size:10px;">
                <span class="sig-prefix">DEVELOPED BY</span>
                <span class="sig-name">@ARMAAN</span>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-storage-compat.js"></script>
    <script src="firebase-init.js"></script>
    <!-- Core Local-First Engine Scripts -->
    <script src="js/core/local-cache.js"></script>
    <script src="js/core/render-engine.js"></script>
    <script src="js/core/firebase-sync.js"></script>
    <script src="js/components/templates.js"></script>
    <script src="js/core/app-init.js"></script>
    <script src="capacitor.js"></script>
    <script src="notifications.js"></script>
    <script src="script.js"></script>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h3>Reset Password</h3>
                <p>Enter your email address to receive a password reset link.</p>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" placeholder="Enter registered email" id="forgotEmailInput">
                </div>
            </div>
            <div class="modal-footer" style="flex-direction: column; gap: 10px; width: 100%;">
                <button id="sendResetBtn" class="modal-btn primary" style="width: 100%;">Send Reset Link</button>
                <button id="cancelResetBtn" class="modal-btn"
                    style="background: transparent; color: var(--text-muted); width: 100%; border: none;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Custom Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <h3 id="modalTitle">Notification</h3>
                <p id="modalMessage">Something went wrong.</p>
            </div>
            <div class="modal-footer">
                <button id="closeModalBtn" class="modal-btn primary">OK</button>
            </div>
        </div>
    </div>
</body>

</html>
