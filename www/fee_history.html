<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fee History | RN-TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="teacher_dashboard.css">
    <link rel="stylesheet" href="global-theme.css">
    <link rel="stylesheet" href="fee_management.css">
    <script src="theme-system.js"></script>
    <script src="no-zoom.js"></script>
    <style>
        .history-container {
            padding: 10px 20px;
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .student-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-dark);
        }

        .student-header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .history-timeline {
            position: relative;
            padding-left: 20px;
            margin-top: 10px;
        }

        .history-timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 6px;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -20px;
            top: 5px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--surface-dark);
            transform: translateX(-50%);
        }

        .timeline-item.payment .timeline-dot {
            background: var(--success);
        }

        .timeline-item.extension .timeline-dot {
            background: var(--warning);
        }

        .timeline-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .timeline-title {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 15px;
        }

        .timeline-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .timeline-amount {
            font-family: monospace;
            font-size: 14px;
            color: var(--success);
            font-weight: 600;
        }

        .timeline-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="dashboard-header">
            <div class="header-main">
                <div class="user-greeting" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a href="fee_management.html" class="back-btn" style="color: var(--text-dark); font-size: 20px; text-decoration: none; padding: 5px; opacity: 0.8;">
                            <i class="fa-solid fa-arrow-left"></i>
                        </a>
                        <h1 class="user-name">Fee History</h1>
                    </div>
                    <button id="resetHistoryBtn" style="background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
                        <i class="fa-solid fa-rotate-left"></i> Reset All
                    </button>
                </div>
            </div>
        </header>

        <main class="dashboard-content" id="dashboardContent" style="padding-top: 15px;">
            <div class="history-container">
                <div class="student-header" id="studentHeader">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--surface-light); display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-user" style="color: var(--text-muted);"></i>
                    </div>
                    <div>
                        <h2 id="displayStudentName">Loading...</h2>
                        <p id="displayStudentCourse">-</p>
                    </div>
                </div>

                <div class="history-timeline" id="historyTimeline">
                    <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Loading history...</p>
                    </div>
                </div>
            </div>
            
            <div class="footer-spacer"></div>
        </main>
    </div>

    <!-- Secure Delete Modal -->
    <div class="modal-overlay" id="deleteHistoryModal">
        <div class="modal-content glass-panel" style="max-width: 400px; text-align: center;">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px;">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 style="margin-bottom: 10px;">Delete History Entry</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Enter Admin Password</p>
            <div class="input-group" style="text-align: left; margin-bottom: 20px;">
                <input type="password" id="deletePasswordInput" class="rn-input" placeholder="Admin Password" style="width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="cancelDeleteBtn" class="btn-secondary" style="flex: 1; padding: 12px; border-radius: 12px;">Cancel</button>
                <button id="confirmDeleteBtn" class="btn-primary" style="flex: 1; padding: 12px; border-radius: 12px; background: var(--danger); border: none; color: #fff; font-weight: 600; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="js/core/local-cache.js"></script>
    
    <script src="fee_history.js"></script>
</body>
</html>
